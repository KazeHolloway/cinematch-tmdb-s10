<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinéMatch : catalogue de films</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="navbar-container">
        <a href="#" class="logo">CinéMatch</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Changer de theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
</header>

<main>
    <section class="hero">
        <h1>Découvrez les films populaires du moment</h1>
    </section>

    <section class="search-section">
        <h2 class="sr-only">Recherche de films</h2>
        <div class="search-bar">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Rechercher un film..." aria-label="Rechercher un film">
            <button id="clear-search" class="clear-search" aria-label="Effacer la recherche">&times;</button>
        </div>
    </section>

    <section class="movies-section">
        <h2 class="sr-only">Liste des films populaires</h2>
        <div id="status-message" class="status-message"></div>
        <div id="movies-grid" class="movies-grid"></div>
    </section>
</main>

<button id="scroll-top" class="scroll-top" aria-label="Remonter en haut">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
</button>

<footer>
    <p>&copy; 2026 CinéMatch, projet réalisé par MASSAMBA BOUESSO Christophe Darly</p>
    <p>Données fournies par <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a></p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
